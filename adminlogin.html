<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>System Access — MARZOFT</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-canvas: #F8F9FC;
            --text-navy: #0B1020;
            --text-muted: #526079;
            --blue-primary: #2563EB;
            --blue-hover: #1D4ED8;
            --blue-soft: #EFF6FF;
            --border-light: #E2E8F0;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Bricolage Grotesque', sans-serif;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, ::after, ::before { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-canvas);
            color: var(--text-navy);
            font-family: var(--font-sans);
            overflow: hidden;
            user-select: none;
        }

        .ambient-mesh {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .ambient-mesh::before, .ambient-mesh::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            animation: float 14s ease-in-out infinite alternate;
        }
        .ambient-mesh::before {
            width: 50vw; height: 50vw;
            top: -10%; left: -10%;
            background: radial-gradient(circle, rgba(37,99,235,0.08), transparent 60%);
        }
        .ambient-mesh::after {
            width: 40vw; height: 40vw;
            bottom: -10%; right: -10%;
            background: radial-gradient(circle, rgba(236,72,153,0.05), transparent 60%);
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, -40px); }
        }

        .camouflage-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .secret-trigger {
            font-family: var(--font-display);
            font-size: clamp(4rem, 16vw, 14rem);
            font-weight: 800;
            letter-spacing: -0.06em;
            color: var(--text-navy);
            cursor: pointer;
            transition: transform 0.3s var(--ease);
            display: flex;
            align-items: flex-end;
            animation: pulseText 6s ease-in-out infinite alternate;
        }
        .secret-trigger .dot {
            width: clamp(10px, 3vw, 24px);
            height: clamp(10px, 3vw, 24px);
            background-color: var(--blue-primary);
            border-radius: 50%;
            margin-left: 4px;
            margin-bottom: clamp(10px, 3vw, 24px);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
        }
        .secret-trigger:active {
            transform: scale(0.98);
        }

        @keyframes pulseText {
            0% { opacity: 0.9; }
            100% { opacity: 1; text-shadow: 0 20px 50px rgba(11, 16, 32, 0.05); }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(248, 249, 252, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s var(--ease);
        }
        .modal-overlay.is-active {
            opacity: 1;
            pointer-events: auto;
        }

        .login-box {
            background: #ffffff;
            width: min(420px, calc(100% - 32px));
            padding: 40px 32px;
            border-radius: 32px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 25px 60px rgba(11, 16, 32, 0.08);
            transform: translateY(20px) scale(0.95);
            transition: transform 0.5s var(--ease);
            text-align: center;
        }
        .modal-overlay.is-active .login-box {
            transform: translateY(0) scale(1);
        }

        .icon-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: var(--blue-soft);
            color: var(--blue-primary);
            border-radius: 50%;
            font-size: 1.2rem;
            margin: 0 auto 20px;
        }

        .login-box h2 {
            font-family: var(--font-display);
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--text-navy);
            margin-bottom: 6px;
        }
        .login-box p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 32px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .admin-input {
            width: 100%;
            height: 56px;
            background: #F8FAFC;
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 0 20px;
            font-family: var(--font-sans);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-navy);
            text-align: center;
            letter-spacing: 0.3em;
            outline: none;
            transition: all 0.3s ease;
        }
        .admin-input::placeholder {
            letter-spacing: 0.2em;
            color: #CBD5E1;
            font-weight: 600;
        }
        .admin-input:focus {
            background: #ffffff;
            border-color: var(--blue-primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .btn-cancel {
            flex: 1;
            height: 56px;
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-navy);
            transition: all 0.3s ease;
        }
        .btn-cancel:hover {
            background: #F1F5F9;
            border-color: #CBD5E1;
        }

        .btn-submit {
            flex: 2;
            height: 56px;
            background: var(--blue-primary);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-submit:hover:not(:disabled) {
            background: var(--blue-hover);
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.3);
        }
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            background: #FEF2F2;
            color: #DC2626;
            border: 1px solid #FECACA;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 20px;
        }
        .error-message.is-visible {
            display: block;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

    <div class="ambient-mesh"></div>

    <div class="camouflage-wrapper">
        <div id="secret-trigger" class="secret-trigger" aria-label="Marzoft Logo">
            MARZOFT<span class="dot"></span>
        </div>
    </div>

    <div id="login-modal" class="modal-overlay">
        <div class="login-box">
            <div class="icon-circle">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2>Admin Access</h2>
            <p>Please authenticate to continue.</p>
            
            <form id="admin-login-form" class="login-form">
                <input type="password" id="admin-password" class="admin-input" placeholder="••••••••" required autocomplete="current-password">
                <div class="btn-row">
                    <button type="button" id="cancel-btn" class="btn-cancel">Cancel</button>
                    <button type="submit" id="submit-btn" class="btn-submit">Login</button>
                </div>
            </form>

            <div id="error-box" class="error-message"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase.js"></script>

        <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const trigger = document.getElementById('secret-trigger');
            const modal = document.getElementById('login-modal');
            const form = document.getElementById('admin-login-form');
            const passwordInput = document.getElementById('admin-password');
            const submitBtn = document.getElementById('submit-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            const errorBox = document.getElementById('error-box');

            const ADMIN_EMAIL = 'hellomarzoft@gmail.com';
            let secretWord = "adminx";
            let typedWord = "";
            let taps = [];

            const api = window.marzoftBackend || window.MarzoftSupabase;

            // Fetch Secret Word Securely
            try {
                if (api && api.client) {
                    const { data, error } = await api.getPublicSetting('secret_word');
                    if (!error && data) secretWord = data.replace(/['"]/g, '').toLowerCase();
                }
            } catch (e) {}
            
            const showModal = () => { modal.classList.add('is-active'); setTimeout(() => passwordInput.focus(), 100); };
            const hideModal = () => { modal.classList.remove('is-active'); form.reset(); hideError(); };
            const showError = (msg) => { errorBox.textContent = msg; errorBox.classList.add('is-visible'); };
            const hideError = () => { errorBox.classList.remove('is-visible'); errorBox.textContent = ''; };

            trigger.addEventListener('click', () => {
                taps.push(Date.now());
                if (taps.length > 3) taps.shift();
                if (taps.length === 3 && taps[2] - taps[0] < 1200) { showModal(); taps = []; }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { hideModal(); return; }
                if (modal.classList.contains('is-active') || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
                if (e.key.length === 1) {
                    typedWord = (typedWord + e.key.toLowerCase()).slice(-secretWord.length);
                    if (typedWord === secretWord) { showModal(); typedWord = ""; }
                }
            });

            cancelBtn.addEventListener('click', hideModal);

      form.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();
                
                const password = passwordInput.value.trim();
                const originalBtnText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
                submitBtn.disabled = true;

                try {
                    if (!api || !api.client) throw new Error("Database connection unavailable.");

                    // Strict verification against database hash ONLY
                    const { data: isMatch, error: verifyErr } = await api.client.rpc('verify_admin_password', { typed_password: password });
                    
                    if (verifyErr || isMatch !== true) {
                        try {
                            await api.client.rpc('log_admin_access', {
                                p_email: ADMIN_EMAIL,
                                p_event_type: 'FAILED_LOGIN_ATTEMPT',
                                p_status: 'BLOCKED',
                                p_details: 'Incorrect admin password'
                            });
                        } catch(err){}
                        throw new Error("Invalid admin password.");
                    }

                    // Check Role / Access
                    const { data: currentUserData } = await api.client.auth.getUser();
                    if (currentUserData && currentUserData.user) {
                        const { data: hasAccess } = await api.isStaffOrAdmin();
                        if (!hasAccess && currentUserData.user.email !== ADMIN_EMAIL) {
                            throw new Error("Unauthorized access. Admin privileges required.");
                        }
                    }

                    // Log Success & Redirect
                    try {
                        await api.client.rpc('log_admin_access', {
                            p_email: currentUserData?.user?.email || ADMIN_EMAIL,
                            p_event_type: 'ADMIN_GATEWAY_SUCCESS',
                            p_status: 'AUTHORIZED',
                            p_details: 'Admin verified successfully with current password.'
                        });
                    } catch(err){}

                    submitBtn.innerHTML = '<i class="fa-solid fa-check"></i>';
                    submitBtn.style.background = '#10B981';
                    setTimeout(() => { window.location.href = 'admindashboard.html'; }, 400);

                } catch (error) {
                    showError(error.message);
                    submitBtn.innerHTML = originalBtnText;
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
